name: 🏠 Finn.no Oslo Housing Scraper

on:
  schedule:
    - cron: '0 7 1,15 * *'   # 07:00 UTC on the 1st and 15th of each month (~biweekly)
  workflow_dispatch:
    inputs:
      force_reclassify:
        description: 'Re-classify already-classified listings (set category=NULL first)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: "finn-housing"
  cancel-in-progress: false

jobs:
  scrape-and-classify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: 📦 Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.4-finn-${{ hashFiles('finn-housing/r-packages.txt') }}
          restore-keys: ${{ runner.os }}-r-4.4-finn-

      - name: 📚 Install R packages
        run: |
          Rscript -e "
            pkgs <- c(
              'httr2', 'rvest', 'jsonlite', 'dplyr', 'stringr',
              'lubridate', 'DBI', 'RSQLite', 'here',
              'ggplot2', 'scales', 'ggrepel', 'leaflet', 'DT', 'tidyr'
            )
            missing <- pkgs[!pkgs %in% installed.packages()[,'Package']]
            if (length(missing) > 0) {
              message('Installing: ', paste(missing, collapse=', '))
              install.packages(missing,
                repos = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
                quiet = TRUE)
            } else {
              message('All packages already installed.')
            }
          "

      # The scraper saves whatever it collected and exits 0 even when finn.no
      # blocks it mid-run. continue-on-error is the backstop for the case it
      # cannot handle itself (OOM, killed step): classification, the export and
      # the commit below must still run on the data already in the DB.
      - name: 🕷️ Scrape finn.no listings
        id: scrape
        continue-on-error: true
        run: Rscript finn-housing/scraper.R

      - name: ⚠️ Note a failed scrape
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Skrapesteget feilet - fortsetter med dataene som allerede ligger i databasen."

      - name: 🏷️ Classify listings via Claude API
        if: always()
        id: classify
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_reclassify }}" = "true" ]; then
            Rscript -e "
              library(DBI); library(RSQLite)
              con <- dbConnect(SQLite(), 'finn-housing/data/finn_housing.db')
              dbExecute(con, 'UPDATE listings SET category=NULL, category_confidence=NULL, category_reasoning=NULL, classified_at=NULL')
              dbExecute(con, 'UPDATE listings SET standard=NULL, standard_confidence=NULL, standard_reasoning=NULL')
              n <- dbGetQuery(con, 'SELECT COUNT(*) AS n FROM listings')[[1]]
              message('Reset category + standard classification for ', n, ' listings.')
              dbDisconnect(con)
            "
          fi
          Rscript finn-housing/classify.R

      # Always commit: a partial scrape is still progress, and the point of the
      # guards above is that whatever survived reaches the dashboard.
      - name: 💾 Commit updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only stash when there is something to stash, so the conflict branch
          # below cannot fire on an empty "No local changes to save".
          STASHED=false
          if [ -n "$(git status --porcelain)" ]; then
            git stash --include-untracked && STASHED=true
          fi
          git pull --rebase origin main
          if [ "$STASHED" = "true" ] && ! git stash pop; then
            echo "::warning::stash pop conflicted — keeping this run's freshly scraped data"
            # The stashed side ('theirs') is what this run produced; a conflicted
            # merge of a SQLite file or CSV would otherwise commit garbage.
            git checkout --theirs -- finn-housing/data/ 2>/dev/null || true
            git add finn-housing/data/
          fi
          git add finn-housing/data/finn_housing.db finn-housing/data/listings_export.csv
          # Safety net: never commit a CSV with unresolved conflict markers
          if git grep --cached -nE '^(<<<<<<<|>>>>>>>)' -- finn-housing/data/listings_export.csv; then
            echo "::error::conflict markers in listings_export.csv — aborting the commit"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "Nothing to commit — no new listings or classifications."
          else
            COUNT=$(Rscript -e "
              library(DBI); library(RSQLite)
              con <- dbConnect(SQLite(), 'finn-housing/data/finn_housing.db')
              n <- dbGetQuery(con, 'SELECT COUNT(*) AS n FROM listings')[[1]]
              cat(n)
              dbDisconnect(con)
            " 2>/dev/null)
            git commit -m "🏠 Oslo housing — $(date +%Y-%m-%d) — ${COUNT} listings [skip ci]"
            git push
          fi
